<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ten type pairings</title>
    <style>
      :root {
        --ink: #101014;
        --body: #2e2e35;
        --muted: #4d4d56;
        --faint: #6b6b75;
        --hair: #ededf0;
        --sunken: #f7f7f8;
        --panel: #131317;
        --done: #067647;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: #fff; color: var(--ink);
        font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px;
        font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
      }
      .page { max-width: 1180px; padding: 56px 40px 90px; margin: 0 auto; }
      .lede h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.016em; }
      .lede p { max-width: 620px; margin: 10px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
      .lede code { padding: 1px 5px; border-radius: 4px; background: var(--sunken); font-size: 12.5px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 44px 40px; margin-top: 52px; }

      .head { display: flex; align-items: baseline; gap: 10px; padding-bottom: 12px; }
      .num { color: var(--faint); font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
      .head h2 { margin: 0; font-size: 15px; font-weight: 600; }
      .stack { margin-left: auto; color: var(--faint); font-size: 11.5px; text-align: right; }

      /* the specimen is the real screen, so only the type changes between them */
      .spec { padding: 22px 24px 24px; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px var(--hair); }
      .spec .greet { color: var(--body); font-size: 13px; }
      .spec .greet b { font-weight: 600; }
      .spec .title { margin: 5px 0 0; font-size: 24px; font-weight: 600; letter-spacing: -.014em; line-height: 1.2; }
      .spec .sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
      .pills { display: flex; gap: 8px; margin: 18px 0 20px; }
      .pill { display: flex; flex: 0 0 auto; min-width: 118px; align-items: baseline; gap: 6px; padding: 6px 12px; border: 1px solid var(--hair); border-radius: 20px; }
      .pill b { font-size: 17px; font-weight: 600; line-height: 1; }
      .pill span { color: var(--muted); font-size: 12.5px; font-weight: 500; }
      .pill.done b, .pill.done span { color: var(--done); }
      .panel { padding: 15px 17px 16px; border-radius: 11px; background: var(--panel); color: #fff; }
      .panel .kick { font-size: 12.5px; font-weight: 600; }
      .panel h3 { margin: 7px 0 4px; font-size: 17px; font-weight: 600; letter-spacing: -.014em; }
      .panel p { margin: 0; color: #b5b5c0; font-size: 13px; line-height: 1.5; }
      .section { margin: 20px 0 8px; font-size: 13px; font-weight: 600; }
      .section i { margin-left: 7px; color: var(--faint); font-style: normal; font-weight: 600; font-size: 11.5px; }
      .row { display: flex; align-items: start; gap: 10px; padding: 7px 0; }
      .row .mark { display: grid; place-items: center; flex: 0 0 auto; width: 19px; height: 19px; margin-top: 1px; border-radius: 50%; background: var(--panel); color: #fff; font-size: 8.5px; font-weight: 700; }
      .row .name { display: block; font-size: 13.5px; font-weight: 600; letter-spacing: -.004em; }
      .row .note { display: block; margin-top: 1px; color: var(--body); font-size: 13px; line-height: 1.4; }
      .row .when { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }

      /* ---- the ten pairings ---- */
      .p1  { --display: -apple-system, system-ui, sans-serif; --text: -apple-system, system-ui, sans-serif; }
      .p2  { --display: "Helvetica Neue", Helvetica, sans-serif; --text: "Helvetica Neue", Helvetica, sans-serif; }
      .p3  { --display: "Avenir Next", Avenir, sans-serif; --text: "Avenir Next", Avenir, sans-serif; }
      .p4  { --display: Futura, "Avenir Next", sans-serif; --text: "Avenir Next", Avenir, sans-serif; }
      .p5  { --display: Optima, "Gill Sans", sans-serif; --text: "Helvetica Neue", Helvetica, sans-serif; }
      .p6  { --display: "Iowan Old Style", Charter, Georgia, serif; --text: "Helvetica Neue", Helvetica, sans-serif; }
      .p7  { --display: Charter, Georgia, serif; --text: Charter, Georgia, serif; }
      .p8  { --display: Didot, "Hoefler Text", serif; --text: "Avenir Next", Avenir, sans-serif; }
      .p9  { --display: "DIN Alternate", "Helvetica Neue", sans-serif; --text: -apple-system, system-ui, sans-serif; }
      .p10 { --display: Seravek, "Gill Sans", sans-serif; --text: Seravek, "Gill Sans", sans-serif; }

      .spec { font-family: var(--text); }
      .spec .title, .panel h3, .pill b { font-family: var(--display); }
      /* pairing 9 sets its labels and numerals in mono, the way engineering tools do */
      .p9 .pill span, .p9 .section, .p9 .row .when { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; letter-spacing: -.02em; }
      .p9 .pill b { letter-spacing: -.01em; }

      @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } .page { padding: 40px 20px 70px; } }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="lede">
        <h1>Ten type pairings</h1>
        <p>
          The same screen ten times; only the typefaces change. Every face here is already
          installed on macOS, so nothing loads over the network and nothing silently falls
          back. To use one, set <code>--display</code> and <code>--sans</code> in
          <code>src/styles.css</code>.
        </p>
      </div>

      <div class="grid" id="grid"></div>
    </div>

    <script>
      var PAIRINGS = [
        ['01', 'System',        'SF Pro throughout',                'The macOS default. Invisible, neutral, and what every other Mac app looks like.'],
        ['02', 'Swiss',         'Helvetica Neue throughout',        'Tighter and flatter than SF. Reads as deliberate rather than default.'],
        ['03', 'Geometric',     'Avenir Next throughout',           'What the prototype uses now. Round, warm, a little 2015.'],
        ['04', 'Futura head',   'Futura over Avenir Next',          'Sharp geometric display on a softer body. Strong headline personality.'],
        ['05', 'Humanist',      'Optima over Helvetica Neue',       'Calligraphic display with flared stems. Warm without being a serif.'],
        ['06', 'Editorial',     'Iowan Old Style over Helvetica',   'Serif headline, neutral body. Reads considered and a bit journalistic.'],
        ['07', 'All serif',     'Charter throughout',               'Serif even at 13px. Unusual for a tool; dense and quite readable.'],
        ['08', 'High contrast', 'Didot over Avenir Next',           'Fashion-magazine display. Elegant, and risky at small sizes.'],
        ['09', 'Engineering',   'DIN Alternate, mono labels',       'Condensed display with monospaced labels and timestamps.'],
        ['10', 'Soft humanist', 'Seravek throughout',               'Gentler than Avenir, narrower than SF. Quiet and legible.']
      ];

      function specimen(cls) {
        return '<div class="spec ' + cls + '">'
          + '<p class="greet">Morning, Swathi. <b>6 decisions</b> across 3 goals need you.</p>'
          + '<p class="title">Convert free users to paid</p>'
          + '<p class="sub">Turn the 1,200 free accounts into revenue when v2 ships.</p>'
          + '<div class="pills">'
            + '<span class="pill"><b>2</b><span>needs you</span></span>'
            + '<span class="pill"><b>3</b><span>working</span></span>'
            + '<span class="pill done"><b>1</b><span>done</span></span>'
          + '</div>'
          + '<div class="panel">'
            + '<div class="kick">Your move</div>'
            + '<h3>Pick who to target first</h3>'
            + '<p>Two groups convert very differently. This is holding up “Write the upgrade emails”.</p>'
          + '</div>'
          + '<p class="section">Working<i>3</i></p>'
          + '<div class="row"><span class="mark">MR</span><span><span class="name">Score the 340 active accounts</span>'
            + '<span class="note">Ranking them by likelihood to pay.</span></span><span class="when">about 20m left</span></div>'
          + '<div class="row"><span class="mark">OW</span><span><span class="name">Write the upgrade emails</span>'
            + '<span class="note">Drafting the first three.</span></span><span class="when">about 1h left</span></div>'
          + '</div>';
      }

      document.getElementById('grid').innerHTML = PAIRINGS.map(function (p) {
        return '<section>'
          + '<div class="head"><span class="num">' + p[0] + '</span><h2>' + p[1] + '</h2>'
          + '<span class="stack">' + p[2] + '</span></div>'
          + '<p style="margin:0 0 14px;color:var(--muted);font-size:12.5px;line-height:1.5">' + p[3] + '</p>'
          + specimen('p' + parseInt(p[0], 10))
          + '</section>';
      }).join('');
    </script>
  </body>
</html>
